version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nkerp
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/nkerp
      - JWT_SECRET=change-me
    depends_on:
      - db
    ports:
      - '4000:4000'
  frontend:
    build:
      context: frontend-react
    ports:
      - '3000:5173'
    depends_on:
      - backend
volumes:
  db-data:
