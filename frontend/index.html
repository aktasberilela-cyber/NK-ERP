<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NK ERP - Prototype</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-brand">NK ERP</div>
      <nav>
        <a class="active">HOME</a>
        <a>MESSAGES</a>
        <a>CALENDER</a>
        <a>DASBOARD</a>
        <a>PRİM TABLE</a>
        <a>DOCTORS - PHARMACISTS</a>
        <a class="exit">EXIT</a>
      </nav>
    </aside>

    <main class="main">
      <header class="main-header">
        <h1>MESSAGES</h1>
        <button class="btn new">+ YENİ MESAJ</button>
        <button class="btn notify">BİLDİRİMLER</button>
      </header>

      <section class="panels">
        <div class="panel messages">
          <div class="field to">ALICI:</div>
          <div class="field msg">MESAJINIZ:</div>
        </div>

        <div class="panel notifications">
          <!-- bildirimler kutusu -->
        </div>
      </section>

      <section class="history">
        <div class="history-card">
          <div class="tab">GEÇMİŞ</div>
          <div class="item">İSİM SOYİSİM - GG.AA.YYYY</div>
        </div>
      </section>

      <section class="dashboard-preview">
        <div class="dash-left">
          <div class="chart-placeholder">[Charts grid preview]</div>
        </div>
        <aside class="dash-right">
          <div class="stat">2.035.687<br><small>Visits</small></div>
          <div class="stat">96 sec<br><small>Avg Session</small></div>
          <div class="stat">2.2 Pages<br><small>Per Visit</small></div>
        </aside>
      </section>

    </main>
  </div>
</body>
</html>
